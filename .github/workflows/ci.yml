name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./...
      - name: Go vulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: Web install
        run: npm --prefix web ci
      - name: Web audit
        run: npm --prefix web audit --audit-level=high
      - name: Web build
        run: npm --prefix web run build
      - name: API smoke
        run: ./scripts/smoke.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Semgrep security scan
        uses: returntocorp/semgrep@main
        with:
          config: >-
            p/ci
            p/secrets
            p/audit-trail
            p/command-injection
            p/path-traversal
            p/weak-crypto
            p/sql-injection
            p/xss

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Compare deterministic Go builds
        run: |
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o /tmp/missionledger-api-1 ./cmd/api
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o /tmp/missionledger-api-2 ./cmd/api
          cmp /tmp/missionledger-api-1 /tmp/missionledger-api-2
          sha256sum /tmp/missionledger-api-1 > build-hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-hash
          path: build-hash.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic Docker image
        if: hashFiles('Dockerfile') != ''
        run: |
          docker build --no-cache --pull -t $(basename ${{ github.repository }}):local .
          docker save $(basename ${{ github.repository }}):local | sha256sum > docker-hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: docker-hash
          path: docker-hash.txt