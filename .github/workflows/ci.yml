name: ci

on:
  push:
  pull_request:

jobs:
  go-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run tests
        run: go test ./...
      - name: Build API
        run: go build ./cmd/api
