name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Run tests
        run: go test ./...
      - name: Build API
        run: go build -o .tmp/missionledger-api ./cmd/api
      - name: Build operator console
        run: npm --prefix web run build
      - name: Smoke test
        run: ./scripts/smoke.sh
